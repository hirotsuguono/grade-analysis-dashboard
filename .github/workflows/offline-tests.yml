name: Offline ZIP tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Packaged app / Chromium / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: |
          npx --no-install playwright-core install --with-deps chromium
          sudo apt-get install -y xdotool x11-utils imagemagick tesseract-ocr

      - name: Run unit tests
        run: npm test

      - name: Build and verify a candidate ZIP without changing the distributed ZIP
        run: |
          npm run build -- --output "$RUNNER_TEMP/grade-analysis-dashboard.zip"
          npm run check -- --output "$RUNNER_TEMP/grade-analysis-dashboard.zip"
          git diff --exit-code -- downloads/

      - name: Extract the verified candidate ZIP
        run: python3 -m zipfile -e "$RUNNER_TEMP/grade-analysis-dashboard.zip" "$RUNNER_TEMP/dashboard-unpacked"

      - name: Test the extracted app with file URLs and networking disabled
        env:
          DASHBOARD_ROOT: ${{ runner.temp }}/dashboard-unpacked/grade-analysis-dashboard
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run test:browser 2>&1 | tee test-results/browser-run.log

      - name: Verify native save picker and real file writes from local HTML
        env:
          DASHBOARD_ROOT: ${{ runner.temp }}/dashboard-unpacked/grade-analysis-dashboard
        run: |
          set -o pipefail
          xvfb-run -a node tests/native-save-browser.cjs 2>&1 | tee test-results/native-save.log

      - name: Summarize browser results
        if: ${{ always() }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          lines = ['## Offline browser tests', '']
          incomplete = False
          for name in ['browser-results.json', 'onboarding/onboarding-results.json', 'native-save-results.json']:
              report = Path('test-results') / name
              if report.exists():
                  result = json.loads(report.read_text())
                  lines.append(f'- {name}: {len(result["checks"])} checks passed')
              else:
                  incomplete = True
                  lines.append(f'- {name}: no successful result produced')
          for filename in ['browser-run.log', 'native-save.log']:
              log = Path('test-results') / filename
              if log.exists():
                  lines += ['', filename, '```text', *log.read_text().splitlines()[-100:], '```']
                  if incomplete:
                      message = '\n'.join(log.read_text().splitlines()[-35:])
                      message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print(f'::error title=Offline browser test failed::{message}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY

      - name: Upload the candidate ZIP for manual review
        uses: actions/upload-artifact@v5
        with:
          name: update-guidance-preview
          path: ${{ runner.temp }}/grade-analysis-dashboard.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser reports and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: offline-browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
