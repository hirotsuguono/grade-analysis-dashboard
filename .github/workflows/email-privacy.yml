name: Commit email privacy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test privacy checks
        run: python3 -m unittest discover -s tests -p 'test_commit_email.py'
      - name: Verify Git identities and messages throughout history
        run: python3 scripts/check_commit_email.py
